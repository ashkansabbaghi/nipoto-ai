[project]
name = "nipoto-ai"
version = "0.1.0"
description = "Nipoto AI support service: knowledge search, staff drafts and auto replies."
readme = "CLAUDE.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "openai>=1.40",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "openapi-spec-validator>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Persian text legitimately contains "confusable" characters
    "S101",                        # assert is fine in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "db: needs a running Postgres (DATABASE_URL); skipped otherwise",
]
